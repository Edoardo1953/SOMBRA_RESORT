name: Auto Build Data.js on Excel Upload

on:
  push:
    paths:
      - 'uploads/**.xlsx'
      - 'uploads/**.XLSX'
      - 'build_data_js.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Run build_data_js.py
        run: |
          python build_data_js.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js uploads/
          if git diff --staged --quiet; then
            echo "No changes detected in data.js."
          else
            git commit -m "Auto-update data.js after Excel upload [skip ci]"
            git push
          fi
